<!-- Asunto: Confirmá tu cuenta de Zenovi -->
<!-- Supabase › Authentication › Emails › Templates › Confirm signup -->
<div style="background:#f1f1f2;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:20px;">
    <tr>
      <td style="padding:36px 36px 8px;text-align:center;">
        <img src="https://app.zenovi.app/brand/zenovi-app-icon.png" width="48" height="48" alt="Zenovi" style="display:inline-block;width:48px;height:48px;border-radius:12px;border:0;" />
      </td>
    </tr>
    <tr>
      <td style="padding:12px 36px 0;text-align:center;">
        <h1 style="margin:0;font-size:22px;line-height:28px;font-weight:600;color:#000000;letter-spacing:-0.02em;">Confirmá tu correo</h1>
        <p style="margin:10px 0 0;font-size:14px;line-height:21px;color:#66666b;">Ingresá este código en Zenovi para terminar de crear tu cuenta.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 36px;text-align:center;">
        <div style="display:inline-block;padding:14px 22px;border-radius:14px;background:#f1f1f2;font-size:32px;line-height:36px;font-weight:600;letter-spacing:0.28em;color:#000000;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
        <p style="margin:14px 0 0;font-size:12px;line-height:18px;color:#737378;">Vence en una hora.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 36px 32px;text-align:center;border-top:1px solid #ededf0;">
        <p style="margin:20px 0 0;font-size:12px;line-height:18px;color:#737378;">¿Preferís un enlace? <a href="{{ .ConfirmationURL }}" style="color:#000000;font-weight:600;">Confirmá desde acá</a>.</p>
        <p style="margin:8px 0 0;font-size:12px;line-height:18px;color:#737378;">Si no creaste una cuenta en Zenovi, ignorá este correo.</p>
      </td>
    </tr>
  </table>
</div>
