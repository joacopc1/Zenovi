<!-- Asunto: Recuperá tu acceso a Zenovi -->
<!-- Supabase › Authentication › Emails › Templates › Reset password -->
<div style="background:#f1f1f2;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:20px;">
    <tr>
      <td style="padding:36px 36px 8px;text-align:center;">
        <img src="https://app.zenovi.app/brand/zenovi-mark.png" width="36" height="36" alt="Zenovi" style="display:inline-block;background:#000000;border-radius:999px;padding:8px;" />
      </td>
    </tr>
    <tr>
      <td style="padding:12px 36px 0;text-align:center;">
        <h1 style="margin:0;font-size:22px;line-height:28px;font-weight:600;color:#000000;letter-spacing:-0.02em;">Elegí una contraseña nueva</h1>
        <p style="margin:10px 0 0;font-size:14px;line-height:21px;color:#66666b;">Pediste recuperar el acceso a tu cuenta de Zenovi.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 36px;text-align:center;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 26px;border-radius:12px;background:#000000;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;">Cambiar contraseña</a>
        <p style="margin:14px 0 0;font-size:12px;line-height:18px;color:#737378;">El enlace vence en una hora.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 36px 32px;text-align:center;border-top:1px solid #ededf0;">
        <p style="margin:20px 0 0;font-size:12px;line-height:18px;color:#737378;">Si no fuiste vos, ignorá este correo: tu contraseña sigue igual.</p>
      </td>
    </tr>
  </table>
</div>
